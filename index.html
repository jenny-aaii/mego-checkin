<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>實習生打卡系統</title>
<link rel="stylesheet" href="style.css?v=16" />
</head>
<body>

<!-- 登入畫面 -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>實習生打卡系統</h1>
    <p class="subtitle">MEVOLUTION GO 2026 實習生計畫</p>
    <button id="googleLoginBtn" class="btn-primary" type="button">使用 Google 帳號登入</button>
    <p id="loginError" class="notice hidden"></p>
  </div>
</div>

<div class="app hidden" id="appRoot">

  <header class="topbar">
    <h1>實習生打卡系統</h1>
    <div class="user-bar">
      <span id="userBadge"></span>
      <button id="manageInternsBtn" class="btn-secondary hidden" type="button">管理實習生名單</button>
      <button id="logoutBtn" class="btn-secondary" type="button">登出</button>
    </div>
  </header>

  <section class="card selector-card">
    <div class="field-group hidden" id="internSelectGroup">
      <label for="internSelect">實習生</label>
      <select id="internSelect"></select>
    </div>

    <div class="field-group">
      <label>月份</label>
      <div class="month-row">
        <button id="prevMonthBtn" class="btn-icon" type="button" aria-label="上個月">‹</button>
        <span id="monthLabel" class="month-label"></span>
        <button id="nextMonthBtn" class="btn-icon" type="button" aria-label="下個月">›</button>
      </div>
    </div>

    <div class="field-group">
      <label>本期區間（預設上月25號~本月24號，可個別調整）</label>
      <div class="period-row">
        <input type="date" id="periodStartInput" />
        <span class="period-sep">~</span>
        <input type="date" id="periodEndInput" />
      </div>
    </div>

    <div class="field-group">
      <label for="buInput">實習 BU / 部門（本月適用）</label>
      <input type="text" id="buInput" placeholder="例如：總部 / 人資部" />
    </div>

    <div class="field-group">
      <label for="supervisorInput">主管（本月適用）</label>
      <input type="text" id="supervisorInput" placeholder="例如：Doris" />
    </div>
  </section>

  <section class="card clock-card">
    <div class="clock-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">尚未上班</span>
      <span id="todayLabel" class="today-label"></span>
    </div>
    <div class="clock-buttons">
      <button id="clockInBtn" class="btn-primary" type="button">上班打卡</button>
      <button id="clockOutBtn" class="btn-primary" type="button">下班打卡</button>
    </div>
    <p id="notTodayNotice" class="notice hidden">目前檢視非本月，打卡按鈕僅在檢視當月時可用，請於下表手動修正時間。</p>
  </section>

  <section class="card summary-card">
    <div class="summary-item">
      <span class="summary-label">本月總工時</span>
      <span class="summary-value" id="totalHours">0.00</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">出勤天數</span>
      <span class="summary-value" id="attendDays">0</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">請假天數</span>
      <span class="summary-value" id="leaveDays">0</span>
    </div>
  </section>

  <section class="card table-card">
    <div class="table-scroll">
      <table id="recordTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>星期</th>
            <th>上班時間</th>
            <th>下班時間</th>
            <th>假別</th>
            <th>工時</th>
            <th>備註</th>
          </tr>
        </thead>
        <tbody id="recordTbody"></tbody>
      </table>
    </div>
  </section>

  <section class="card leave-stat-card">
    <h2>請假統計</h2>
    <div id="leaveStatList" class="leave-stat-list"></div>
  </section>

  <div class="export-row">
    <button id="exportBtn" class="btn-primary btn-export" type="button">一鍵產出月結 PDF</button>
  </div>

</div>

<!-- HR 專用：管理登入名單（實習生 + HR） -->
<div id="manageInternsOverlay" class="overlay hidden">
  <div class="overlay-card">
    <div class="overlay-header">
      <h2>管理登入名單</h2>
      <button id="closeManageInternsBtn" class="btn-icon" type="button" aria-label="關閉">×</button>
    </div>
    <p class="notice-inline">刪除只會移除登入白名單，不會刪除該帳號已產生的打卡紀錄。</p>
    <div id="internListManage" class="intern-manage-list"></div>
    <div class="add-intern-card">
      <h3>＋ 新增帳號</h3>
      <div class="add-intern-row">
        <input type="text" id="newInternName" placeholder="姓名" />
        <input type="email" id="newInternEmail" placeholder="Google 帳號 email" />
        <select id="newInternRole">
          <option value="intern">實習生</option>
          <option value="hr">HR</option>
        </select>
        <button id="addInternBtn" class="btn-primary" type="button">新增</button>
      </div>
    </div>
  </div>
</div>

<!-- 列印用月結表，畫面上隱藏，僅於匯出 PDF 時顯示 -->
<div id="printArea" class="print-only">
  <h1 id="printTitle"></h1>
  <div class="print-meta">
    <span id="printName"></span>
    <span id="printBu"></span>
    <span id="printSupervisor"></span>
    <span id="printMonth"></span>
  </div>
  <div class="print-summary">
    <span id="printTotalHours"></span>
    <span id="printAttendDays"></span>
    <span id="printLeaveDays"></span>
  </div>
  <table id="printTable">
    <thead>
      <tr>
        <th>日期</th>
        <th>星期</th>
        <th>上班</th>
        <th>下班</th>
        <th>工時</th>
        <th>假別</th>
        <th>備註</th>
      </tr>
    </thead>
    <tbody id="printTbody"></tbody>
  </table>
  <div class="print-leave-stats" id="printLeaveStats"></div>
  <div class="print-signatures">
    <div class="sig-box"><span class="sig-label">實習生簽名</span><span class="sig-name">&nbsp;</span><span class="sig-line"></span></div>
    <div class="sig-box"><span class="sig-label">主管簽名</span><span class="sig-name" id="printSupervisorName">&nbsp;</span><span class="sig-line"></span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="app.js?v=17"></script>
</body>
</html>
