<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>米果計畫｜實習生打卡時數表</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <h1>米果計畫｜實習生打卡時數表</h1>
    <p class="subtitle">MEVOLUTION GO 2026 實習生計畫（Demo 版本）</p>
  </header>

  <section class="card selector-card">
    <div class="field-group">
      <label for="nameSelect">姓名</label>
      <div class="name-row">
        <select id="nameSelect"></select>
        <button id="addNameBtn" class="btn-secondary" type="button">新增</button>
      </div>
    </div>

    <div class="field-group">
      <label>月份</label>
      <div class="month-row">
        <button id="prevMonthBtn" class="btn-icon" type="button" aria-label="上個月">‹</button>
        <span id="monthLabel" class="month-label"></span>
        <button id="nextMonthBtn" class="btn-icon" type="button" aria-label="下個月">›</button>
      </div>
    </div>

    <div class="field-group">
      <label for="supervisorInput">主管姓名（本月適用）</label>
      <input type="text" id="supervisorInput" placeholder="例如：王小明（人資部主管）" />
    </div>
  </section>

  <section class="card clock-card">
    <div class="clock-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">尚未上班</span>
      <span id="todayLabel" class="today-label"></span>
    </div>
    <div class="clock-buttons">
      <button id="clockInBtn" class="btn-primary" type="button">上班打卡</button>
      <button id="clockOutBtn" class="btn-primary" type="button">下班打卡</button>
    </div>
    <p id="notTodayNotice" class="notice hidden">目前檢視非本月，打卡按鈕僅在檢視當月時可用，請於下表手動修正時間。</p>
  </section>

  <section class="card summary-card">
    <div class="summary-item">
      <span class="summary-label">本月總工時</span>
      <span class="summary-value" id="totalHours">0.00</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">出勤天數</span>
      <span class="summary-value" id="attendDays">0</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">請假天數</span>
      <span class="summary-value" id="leaveDays">0</span>
    </div>
  </section>

  <section class="card table-card">
    <div class="table-scroll">
      <table id="recordTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>星期</th>
            <th>上班時間</th>
            <th>下班時間</th>
            <th>假別</th>
            <th>午休扣除</th>
            <th>工時</th>
            <th>備註</th>
          </tr>
        </thead>
        <tbody id="recordTbody"></tbody>
      </table>
    </div>
  </section>

  <section class="card leave-stat-card">
    <h2>請假統計</h2>
    <div id="leaveStatList" class="leave-stat-list"></div>
  </section>

  <div class="export-row">
    <button id="exportBtn" class="btn-primary btn-export" type="button">一鍵產出月結 PDF</button>
  </div>

</div>

<!-- 列印用月結表，畫面上隱藏，僅於匯出 PDF 時顯示 -->
<div id="printArea" class="print-only">
  <h1 id="printTitle"></h1>
  <div class="print-meta">
    <span id="printName"></span>
    <span id="printMonth"></span>
  </div>
  <div class="print-summary">
    <span id="printTotalHours"></span>
    <span id="printAttendDays"></span>
    <span id="printLeaveDays"></span>
  </div>
  <table id="printTable">
    <thead>
      <tr>
        <th>日期</th>
        <th>星期</th>
        <th>上班</th>
        <th>下班</th>
        <th>午休扣除</th>
        <th>工時</th>
        <th>假別</th>
        <th>備註</th>
      </tr>
    </thead>
    <tbody id="printTbody"></tbody>
  </table>
  <div class="print-leave-stats" id="printLeaveStats"></div>
  <div class="print-signatures">
    <div class="sig-box"><span class="sig-label">實習生簽名</span><span class="sig-name">&nbsp;</span><span class="sig-line"></span></div>
    <div class="sig-box"><span class="sig-label">主管簽名</span><span class="sig-name" id="printSupervisorName">&nbsp;</span><span class="sig-line"></span></div>
    <div class="sig-box"><span class="sig-label">HR 簽名</span><span class="sig-name">&nbsp;</span><span class="sig-line"></span></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
